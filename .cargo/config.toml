[build]
# rustflags = ["-C", "relocation-model=static", "-C", "code-model=kernel"]
rustflags = [
	"-Znext-solver=coherence",
	"-C",
	"relocation-model=pic",
	"-C",
	"code-model=kernel",
]

[unstable]
bindeps = true
# build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
unstable-options = true
