[package]
name = "operating_system"
version = "0.1.0"
edition = "2024"
default-run = "qemu"

[workspace]
members = ["bootloader", "kernel", "acpi", "arch", "uefi"]
resolver = "3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
incremental = true
strip = true

[dependencies]
bootloader = { path = "bootloader", artifact = "bin", target = "x86_64-unknown-uefi" }
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[build-dependencies]

[dev-dependencies]
